<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secure GPT</title>
<style>
 :root{--bg:#f7f8fa;--card:#fff;--ink:#1b1f24;--muted:#667085;--accent:#215e99;--line:#e4e7ec}
 @media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--ink:#e8eaee;--muted:#9aa4b2;--accent:#6aa9e6;--line:#2b313b}}
 body{margin:0;font:15px/1.5 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100vh}
 header{padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card);display:flex;gap:10px;align-items:center}
 header b{color:var(--accent)} header span{color:var(--muted);font-size:13px}
 #log{flex:1;overflow:auto;padding:20px;max-width:820px;width:100%;margin:0 auto;box-sizing:border-box}
 .m{margin:0 0 14px;padding:10px 14px;border-radius:10px;white-space:pre-wrap;border:1px solid var(--line);background:var(--card)}
 .u{background:var(--accent);color:#fff;border-color:var(--accent);margin-left:15%}
 .n{font-size:13px;color:#b54708;background:transparent;border:1px dashed #b54708}
 form{display:flex;gap:8px;padding:14px 20px;max-width:820px;width:100%;margin:0 auto;box-sizing:border-box}
 textarea{flex:1;resize:none;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
 button{padding:0 18px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;cursor:pointer}
</style></head><body>
<header><b>Secure GPT</b><span>Private to your organisation. Conversations are not stored.</span></header>
<div id="log"></div>
<form id="f"><textarea id="t" rows="2" placeholder="Ask anything about your work..."></textarea><button>Send</button></form>
<script>
const log=document.getElementById('log'),t=document.getElementById('t'),history=[];
function add(cls,text){const d=document.createElement('div');d.className='m '+cls;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
async function send(){
  const text=t.value.trim(); if(!text) return; t.value=''; add('u',text); history.push({role:'user',content:text});
  const wait=add('a','...');
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});
    const j=await r.json(); wait.remove();
    if(!r.ok){add('n',j.detail||'Request failed'); history.pop(); return}
    if(j.notice) add('n',j.notice);
    add('a',j.answer); history.push({role:'assistant',content:j.answer});
  }catch(e){wait.remove(); add('n','Network error')}
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();send()});
t.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
</script></body></html>
